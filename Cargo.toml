[package]
name = "hop"
version = "0.1.0"
description = "tmux popup launcher for projects, services and SSH hosts"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fuzzy-matcher = "0.3.7"
glob = "0.3.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
